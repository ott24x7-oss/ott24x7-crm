<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WA-CRM</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- LICENSE GATE -->
  <section id="gate" class="gate">
    <div class="gate-card">
      <img class="gate-logo" src="../assets/logo-lockup.png" alt="WA-CRM" />
      <p class="muted">Enter your license key to activate this device</p>
      <input id="licenseKey" placeholder="WA-XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocomplete="off" />
      <button id="activateBtn" class="btn primary block">Activate</button>
      <div class="gate-or"><span>or</span></div>
      <button id="trialBtn" class="btn ghost block">Start 7-day Free Trial</button>
      <div id="gateMsg" class="msg" role="status" aria-live="polite"></div>
      <div class="gate-foot muted">Device: <span id="deviceId">…</span></div>
    </div>
  </section>

  <!-- FREE-TRIAL BANNER (shown inside the app while on trial) -->
  <div id="trialBanner" class="trial-banner hidden">
    <span>🎁 Free trial — <b id="trialDays">7 days</b> left</span>
    <button id="trialBuyBtn" class="tb-buy">Buy license</button>
  </div>

  <!-- APP -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><img src="../assets/logo-mark.png" alt="" /><span>WA<b>-CRM</b></span></div>
      <div class="top-center">
        <button id="addAccountTop" class="acct-btn" title="Add a WhatsApp account">＋ Accounts</button>
      </div>
      <div class="top-right">
        <span class="lic-pill">Licensed</span>
        <span class="ver">v0.24.0</span>
        <button id="themeBtn" class="icon-btn" title="Change colour theme" aria-label="Change colour theme">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.2"/><circle cx="17.5" cy="10.5" r="1.2"/><circle cx="8.5" cy="7.5" r="1.2"/><circle cx="6.5" cy="12.5" r="1.2"/><path d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 1.6-3.2 2 2 0 0 1 1.6-3.2h1.9A5 5 0 0 0 22 10.6C22 5.9 17.5 2 12 2z"/></svg>
        </button>
        <button id="deactivateBtn" class="icon-btn" title="Deactivate this device">⏻</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="WhatsApp accounts"></nav>

    <div class="body">
      <div class="wa-stage" id="waStage">
        <div class="wa-empty" id="waEmpty">
          <img src="../assets/logo-mark.png" alt="" />
          <h2>No WhatsApp account yet</h2>
          <p class="muted">Add an account to link a WhatsApp number.</p>
          <button id="addFirst" class="btn primary">＋ Add WhatsApp account</button>
        </div>
      </div>
      <aside class="rail" id="rail" aria-label="Features"></aside>
    </div>

    <div class="panel-scrim hidden" id="panelScrim"></div>
    <section class="feature-panel hidden" id="featurePanel" role="dialog" aria-modal="true">
      <header class="fp-head"><h3 id="fpTitle">Feature</h3><button id="fpClose" class="icon-btn" aria-label="Close">✕</button></header>
      <div class="fp-body" id="fpBody"></div>
    </section>
  </section>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="theme.js"></script>
</body>
</html>
