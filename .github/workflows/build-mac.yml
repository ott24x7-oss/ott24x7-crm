# Builds the macOS app on a GitHub-hosted macOS runner.
#
# macOS targets cannot be cross-built from Windows (dmg needs macOS-only tooling), so this
# is the only way to ship a Mac build without owning a Mac.
#
# The build is UNSIGNED — no Apple Developer certificate is configured. Gatekeeper will
# refuse a normal double-click; the first launch needs right-click > Open, or
#   xattr -dr com.apple.quarantine "/Applications/WA-CRM.app"
# To ship a signed + notarized build, add these repository secrets, then delete the
# CSC_IDENTITY_AUTO_DISCOVERY line below and remove "identity": null from package.json:
#   CSC_LINK              base64 of your "Developer ID Application" .p12
#   CSC_KEY_PASSWORD      password for that .p12
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   for notarization
name: Build macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in ott24x7-crm-releases to attach the build to (e.g. v0.26.0). Leave blank to only produce workflow artifacts.'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-14 # Apple Silicon runner; builds both arm64 and x64
    permissions:
      # write, so the job can stage the DMGs as a release asset in this repo
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build macOS (dmg + zip, arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned; see header for how to sign
        run: npx electron-builder --mac --publish never

      # wa-crm.in links to fixed filenames so the download URLs survive a version bump,
      # the same way WA-CRM-Setup.exe does on Windows.
      - name: Add stable-name copies
        run: |
          cd release
          for arch in arm64 x64; do
            src=$(ls *mac-$arch.dmg 2>/dev/null | head -1)
            [ -n "$src" ] && cp "$src" "WA-CRM-mac-$arch.dmg" && echo "$src -> WA-CRM-mac-$arch.dmg"
          done

      - name: List artifacts
        run: ls -lh release/ | grep -Ei 'dmg|zip' || ls -lh release/

      # Always available, even if the release upload below is skipped or fails.
      #
      # DMGs only. electron-builder also produces .zip archives, but those exist purely to
      # feed electron-updater on macOS — and that path is dead here: the builds are
      # unsigned, macOS refuses to auto-update an unsigned app, and main.js routes darwin to
      # initManualUpdate() for exactly that reason. No latest-mac.yml is ever generated, so
      # nothing can consume them. Carrying them made the artifact ~600MB instead of ~400MB,
      # and downloads of it repeatedly timed out.
      - name: Keep as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wa-crm-macos
          path: release/*.dmg
          retention-days: 30
          if-no-files-found: error

      # Staging release in THIS repo, using the built-in GITHUB_TOKEN — no PAT needed.
      #
      # Downloading a 400-600MB workflow artifact fails reliably from some networks (it is
      # one large zip, no resume). Release assets are served separately and download fine.
      # So the DMGs are published here first and fetched from this release instead, which
      # is the difference between a Mac build shipping and not shipping.
      - name: Stage the DMGs as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true
          gh release create mac-latest release/*.dmg \
            --repo ${{ github.repository }} \
            --title "macOS build staging (not for customers)" \
            --notes "Automated. DMGs from ${{ github.sha }}, staged so they can be fetched as release assets rather than as one oversized workflow artifact." \
            --prerelease

      # Cross-repo upload needs a PAT with `contents: write` on ott24x7-crm-releases,
      # stored as the RELEASES_TOKEN secret. Without it this step is skipped, and the
      # build is still downloadable from the workflow artifacts above.
      - name: Attach to the release
        if: ${{ inputs.tag != '' && env.GH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" release/*.dmg \
            --repo ott24x7-oss/ott24x7-crm-releases --clobber
